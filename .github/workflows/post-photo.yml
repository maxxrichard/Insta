name: Post photo to Instagram

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: Public HTTPS URL of the JPEG to post
        required: true
        type: string
      caption:
        description: Caption (optional)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency: post-photo

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post photo
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_BASE: ${{ vars.IG_API_BASE }}
          IMAGE_URL: ${{ inputs.image_url }}
          CAPTION: ${{ inputs.caption }}
        run: python -m igbot.cli --image-url "$IMAGE_URL" --caption "$CAPTION"
